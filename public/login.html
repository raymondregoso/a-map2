<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Broker Tour Router</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap">
<style>
:root{--teal:#2D8692;--teal2:#26A1B3;--orange:#F7AD50;--cyan:#D5F4F6;--ink:#323232;--muted:#5c6a6d;--line:#d3e3e6;--bg:#f3f8f9;--surface:#fff;--bad:#b4332b}
@media (prefers-color-scheme:dark){:root{--ink:#e6f1f2;--muted:#9ab0b3;--line:#26403f;--bg:#0d191b;--surface:#142427;--bad:#ef7b72;--cyan:#123a40}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Open Sans",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.bar{background:var(--teal);border-bottom:4px solid var(--orange);color:#fff;padding:12px 16px}
.logo{display:inline-flex;align-items:center;gap:8px}
.logo img{height:30px;display:block}
.sq{width:22px;height:22px;background:var(--orange);border-radius:3px 3px 3px 11px}
.wm{font:800 19px/1 Montserrat,sans-serif;letter-spacing:-.02em}.wm b{font-weight:500}
main{flex:1;display:grid;place-items:center;padding:24px 16px}
.card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:12px;padding:24px}
h1{font:800 22px/1.2 Montserrat,sans-serif;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font:600 13px Montserrat,sans-serif;margin:14px 0 6px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--teal2);outline-offset:2px}
button{margin-top:20px;width:100%;font:700 15px Montserrat,sans-serif;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:12px;cursor:pointer}
button:hover{background:#246f79}button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:1.3em;margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
</style>
</head>
<body>
<div class="bar"><span class="logo"><img src="/jvm-logo.png" alt="JVM Lending" hidden onload="this.hidden=false;this.nextElementSibling.hidden=true;this.nextElementSibling.nextElementSibling.hidden=true" onerror="this.remove()"><span class="sq" aria-hidden="true"></span><span class="wm">jvm<b>lending</b></span></span></div>
<main>
  <form class="card" id="f" novalidate>
    <h1>Broker Tour Router</h1>
    <p class="sub">For JVM Lending employees. Sign in with your work email.</p>
    <label for="email">Work email</label>
    <input id="email" type="email" autocomplete="username" placeholder="name@jvmlending.com" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<footer>Need access? Ask Aaron to add you.</footer>
<script>
(function(){
  const $=id=>document.getElementById(id);
  function nextPath(){const n=new URLSearchParams(location.search).get("next")||"/";return /^\/(?!\/)/.test(n)?n:"/"}
  $("f").addEventListener("submit",async e=>{
    e.preventDefault();$("err").textContent="";
    const email=$("email").value.trim(),password=$("password").value;
    if(!email){$("err").textContent="Enter your work email.";$("email").focus();return}
    if(!password){$("err").textContent="Enter your password.";$("password").focus();return}
    $("go").disabled=true;$("go").textContent="Signing in…";
    try{
      const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password}),credentials:"same-origin"});
      const j=await r.json().catch(()=>({}));
      if(r.ok){location.replace(nextPath());return}
      $("err").textContent=j.error||"Sign-in didn't work. Try again.";
    }catch(err){$("err").textContent="Can't reach the server. Check your connection and try again."}
    $("go").disabled=false;$("go").textContent="Sign in";$("password").select();
  });
})();
</script>
</body>
</html>
